<div class="app-shell">
  <aside class="sidebar">
    <nav class="side-nav">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
      >
        {{ item.label }}
      </a>
    </nav>
  </aside>

  <div class="workspace">
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
